site_name: Workshop Claude Code
site_description: Apunte de curso para aprender a usar Claude Code (VS Code + terminal)
repo_url: https://github.com/solasantiago/claude
repo_name: solasantiago/claude

theme:
  name: material
  language: es
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Cambiar a modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Cambiar a modo claro
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - search.suggest
    - content.code.copy

nav:
  - Inicio: index.md
  - Módulo 0 - Setup del repo: modulo-0.md
  - Módulo 1 - VS Code vs terminal: modulo-1.md
  - Módulo 6 - Publicar en GitHub: modulo-6.md

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
